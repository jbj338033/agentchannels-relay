name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build container image
        run: docker build --pull -t agentchannels-relay:test .

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Verify Compose runtime and persistence
        run: |
          set -euo pipefail
          trap 'docker compose down --volumes' EXIT

          wait_for_relay() {
            for _ in $(seq 1 30); do
              if curl --silent --output /dev/null http://127.0.0.1:8787/; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          docker compose up --build -d
          wait_for_relay

          relay_http_status=$(curl --silent --output /tmp/relay-response \
            --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{' \
            http://127.0.0.1:8787/v1/installations)
          test "$relay_http_status" = "400"
          docker compose exec -T relay sh -eu -c \
            'test "$(id -u)" = 10001; test "$(id -g)" = 10001; test -f /var/lib/agentchannels-relay/agentchannels-relay.db'

          docker compose stop relay
          docker compose up -d relay
          wait_for_relay
          docker compose exec -T relay test -f \
            /var/lib/agentchannels-relay/agentchannels-relay.db

      - name: Clean up Compose resources
        if: ${{ always() }}
        run: docker compose down --volumes
